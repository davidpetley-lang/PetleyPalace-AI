services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: petley-n8n
    restart: unless-stopped

    ports:
      - "192.168.1.13:5678:5678"

    env_file:
      - .env

    volumes:
      - ./data/n8n:/home/node/.n8n

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - petley-ai

networks:
  petley-ai:
    name: petley-ai
